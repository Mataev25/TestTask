services:
  postgres:
    image: postgres:18
    container_name: testtask-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: testtask-pgadmin
    user: root
    entrypoint: >
      /bin/sh -c "chmod 600 /pgadmin4/pgpass && chown 5050:5050 /pgadmin4/pgpass && exec /entrypoint.sh"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 80  
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass
    depends_on:
      - postgres

  api:
    build: ./TestTask.API
    container_name: testtask-api
    working_dir: /src
    volumes:
      - ./TestTask.API:/src
      - /src/bin
      - /src/obj
      - /src/out
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=testdb;Username=postgres;Password=postgres
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    command: >
      sh -c "dotnet build TestTask.API.csproj -c Release -o /out &&
             dotnet /out/TestTask.API.dll"

volumes:
  pgdata:
  pgadmin_data:
